name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a private wrapper checkout
        run: |
          if git remote -v | grep -q 'gitlab.com/apito.io/engine'; then
            echo "This workflow must build the public engine tree."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: apito-io/open_driver
          # open-core v1.9.6 adds missing users-table auth columns
          # (tenant_id, username, secret, google_sub) before signup queries.
          ref: v1.0.30
          path: .ci/open_driver

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: License manifest
        run: |
          availability=$(git log -1 --format=%cs)
          scripts/release-license-manifest.sh "${GITHUB_REF_NAME}" "$availability" release-manifest.json
          python3 - <<'PY'
          import json
          doc=json.load(open("release-manifest.json"))
          assert doc["spdx"]=="AGPL-3.0-only"
          print(doc["availability_date"], doc["spdx"])
          PY

      - name: Build public engine binary
        run: |
          cd .ci/open_driver/cmd/oss
          go mod edit -replace "github.com/apito-io/engine=${GITHUB_WORKSPACE}"
          go mod edit -replace "github.com/apito-io/open_driver=${GITHUB_WORKSPACE}/.ci/open_driver"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o "$GITHUB_WORKSPACE/apito-engine-linux-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o "$GITHUB_WORKSPACE/apito-engine-linux-arm64" .
          cp "$GITHUB_WORKSPACE/apito-engine-linux-amd64" "$GITHUB_WORKSPACE/apito-engine"

      - name: Public tree license scan
        run: |
          if grep -RIn --include='*.go' 'gitlab.com/apito.io/engine' . .ci/open_driver; then
            echo "private engine import found"
            exit 1
          fi

      - name: Publish engine binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Public engine build"
          gh release upload "${GITHUB_REF_NAME}" apito-engine apito-engine-linux-amd64 apito-engine-linux-arm64 --clobber

      - name: Tell Studio this engine build finished
        env:
          GH_TOKEN: ${{ secrets.STUDIO_DISPATCH_TOKEN }}
        run: |
          gh api repos/apito-io/studio/dispatches --input - <<EOF
          {"event_type":"component_ready","client_payload":{"component":"engine","ref":"${GITHUB_REF_NAME}"}}
          EOF
