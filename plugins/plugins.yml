# HashiCorp Plugin Configuration
# This file defines all available HashiCorp plugins for the Apito Engine
# Each plugin can be written in different languages (Go, JavaScript, Python, etc.)

plugins:
  # Hello World Plugin - Go implementation for testing
  hc-hello-world-plugin:
    id: "hc-hello-world-plugin"
    language: "go"
    title: "Hello World Go HashiCorp Plugin"
    icon: "https://cdn.apito.io/media/apito_website/hashicorp-plugin.png"
    description: "A simple Hello World plugin using HashiCorp go-plugin system"
    type: "project"
    role: ""
    enable: false
    debug: false
    version: "1.0.0"
    author: "Apito"
    repository_url: ""
    branch: ""
    binary_path: "hc-hello-world-plugin"
    handshake_config:
      protocol_version: 1
      magic_cookie_key: "APITO_PLUGIN"
      magic_cookie_value: "apito_plugin_magic_cookie_v1"
    env_vars:
      - key: "GREETING_MESSAGE"
        value: "Hello from HashiCorp Plugin!"
      - key: "DEBUG_MODE"
        value: "true"

  # Hello World JavaScript Plugin - for cross-language testing
  hc-hello-world-js-plugin:
    id: "hc-hello-world-js-plugin"
    language: "js"
    title: "Hello World JavaScript HashiCorp Plugin"
    icon: "https://cdn.apito.io/media/apito_website/javascript-plugin.png"
    description: "A JavaScript implementation of Hello World plugin using HashiCorp go-plugin system with gRPC"
    type: "project"
    role: ""
    exported_variable: "NormalPlugin"
    enable: false
    version: "1.0.0-js"
    author: "Apito"
    repository_url: ""
    branch: ""
    binary_path: "index.js"
    handshake_config:
      protocol_version: 1
      magic_cookie_key: "APITO_PLUGIN"
      magic_cookie_value: "apito_plugin_magic_cookie_v1"
    env_vars:
      - key: "GREETING_MESSAGE"
        value: "Hello from JavaScript Plugin!"
      - key: "DEBUG_MODE"
        value: "true"
      - key: "NODE_ENV"
        value: "production"